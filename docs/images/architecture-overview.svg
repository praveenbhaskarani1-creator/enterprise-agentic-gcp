<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 600" role="img">
<title>Customer Operations agent architecture</title>
<desc>Clients call a FastAPI and A2A endpoint. A supervisor agent routes to read-only data, policy and optional Jira agents and to a human-review staging tool. Tools reach BigQuery, the RAG Engine, Atlassian MCP, and a human reviewer.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.amber rect{fill:#FAEEDA;stroke:#854F0B}
.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#FFFFFF"/>

<g class="gray"><rect x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Users and A2A clients</text></g>
<line x1="340" y1="64" x2="340" y2="88" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="90" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="108" text-anchor="middle" dominant-baseline="central">FastAPI + A2A endpoint</text><text class="ts" x="340" y="128" text-anchor="middle" dominant-baseline="central">Rate limit, tracing</text></g>
<line x1="340" y1="146" x2="340" y2="174" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="190" y="176" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="194" text-anchor="middle" dominant-baseline="central">Supervisor agent</text><text class="ts" x="340" y="214" text-anchor="middle" dominant-baseline="central">Gemini, routes and composes</text></g>

<line x1="340" y1="232" x2="340" y2="257" stroke="#888780" stroke-width="1" fill="none"/>
<path d="M110 257 H560" stroke="#888780" stroke-width="1" fill="none"/>
<line x1="110" y1="257" x2="110" y2="280" class="arr" marker-end="url(#arrow)"/>
<line x1="260" y1="257" x2="260" y2="280" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="257" x2="410" y2="280" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="257" x2="560" y2="280" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="45" y="282" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="300" text-anchor="middle" dominant-baseline="central">Data agent</text><text class="ts" x="110" y="320" text-anchor="middle" dominant-baseline="central">read-only</text></g>
<g class="teal"><rect x="195" y="282" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="300" text-anchor="middle" dominant-baseline="central">Policy agent</text><text class="ts" x="260" y="320" text-anchor="middle" dominant-baseline="central">read-only, cited</text></g>
<g class="teal"><rect x="345" y="282" width="130" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="410" y="300" text-anchor="middle" dominant-baseline="central">Jira agent</text><text class="ts" x="410" y="320" text-anchor="middle" dominant-baseline="central">optional</text></g>
<g class="amber"><rect x="495" y="282" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="300" text-anchor="middle" dominant-baseline="central">Human review</text><text class="ts" x="560" y="320" text-anchor="middle" dominant-baseline="central">stage only</text></g>

<line x1="110" y1="338" x2="110" y2="366" class="arr" marker-end="url(#arrow)"/>
<line x1="260" y1="338" x2="260" y2="366" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="338" x2="410" y2="366" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="338" x2="560" y2="366" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="45" y="368" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="386" text-anchor="middle" dominant-baseline="central">MCP Toolbox</text><text class="ts" x="110" y="406" text-anchor="middle" dominant-baseline="central">sidecar :5000</text></g>
<g class="teal"><rect x="195" y="368" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="260" y="386" text-anchor="middle" dominant-baseline="central">RAG Engine</text><text class="ts" x="260" y="406" text-anchor="middle" dominant-baseline="central">policy corpus</text></g>
<g class="gray"><rect x="345" y="368" width="130" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="410" y="386" text-anchor="middle" dominant-baseline="central">Atlassian MCP</text><text class="ts" x="410" y="406" text-anchor="middle" dominant-baseline="central">external</text></g>
<g class="amber"><rect x="495" y="368" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="386" text-anchor="middle" dominant-baseline="central">Human reviewer</text><text class="ts" x="560" y="406" text-anchor="middle" dominant-baseline="central">acts outside</text></g>

<line x1="110" y1="424" x2="110" y2="452" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="45" y="454" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="472" text-anchor="middle" dominant-baseline="central">BigQuery</text><text class="ts" x="110" y="492" text-anchor="middle" dominant-baseline="central">curated views</text></g>

<g class="teal"><rect x="215" y="462" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="238" y="470" dominant-baseline="central">Agent or read-only tool</text>
<g class="amber"><rect x="215" y="484" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="238" y="492" dominant-baseline="central">Human confirmation gate</text>
<g class="gray"><rect x="215" y="506" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="238" y="514" dominant-baseline="central">Platform or external (dashed = optional)</text>

<rect x="40" y="540" width="600" height="44" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="340" y="562" text-anchor="middle" dominant-baseline="central">Cloud Trace, Cloud Logging, BigQuery agent analytics across every layer</text>
</svg>
